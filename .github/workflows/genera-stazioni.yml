name: Genera stazioni.json

on:
  push:
    paths:
      - 'anagrafica_impianti_attivi.csv'
      - 'prezzo_alle_8.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea stazioni.json
        run: python genera_stazioni.py
      - name: Salva stazioni.json nella repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add stazioni.json
          git diff --staged --quiet || git commit -m "Aggiorna stazioni.json"
          git push
